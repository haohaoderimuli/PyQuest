<style>
  :root{
    --bg:#0b0f14;
    --bg2:#0f151d;
    --panel:#121a24;
    --panel2:#0d141b;
    --line:#1f2c3a;
    --line2:#2c3d50;
    --ink:#dce7f2;
    --ink2:#93a7bb;
    --ink3:#5f7388;
    --yellow:#ffd43b;
    --yellow2:#ffc107;
    --blue:#4b9fe1;
    --ok:#3fd15a;
    --bad:#ff5f57;
    --warn:#e3b341;
    --purple:#b48ef0;
    --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,"Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(75,159,225,.10), transparent 60%),
      radial-gradient(900px 500px at 5% 110%, rgba(255,212,59,.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header{
    height:62px;
    display:flex;align-items:center;gap:18px;
    padding:0 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(18,26,36,.92), rgba(11,15,20,.86));
    backdrop-filter:blur(12px);
    position:relative;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(145deg,#2b5f8a,#3776ab);
    display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(55,118,171,.35), inset 0 1px 0 rgba(255,255,255,.16);
    font-size:19px;
  }
  .brand h1{font-size:16px;font-weight:700;letter-spacing:.5px}
  .brand h1 b{color:var(--yellow);font-weight:800}
  .brand p{font-size:11px;color:var(--ink3);letter-spacing:1.4px;text-transform:uppercase;line-height:1.1;margin-top:1px}
  .prog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
  .bar{flex:1;height:7px;border-radius:99px;background:#0a0e13;border:1px solid var(--line);overflow:hidden;position:relative}
  .bar i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#2f7fbf,var(--yellow));
    border-radius:99px;transition:width .55s cubic-bezier(.22,1,.36,1);
    box-shadow:0 0 12px rgba(255,212,59,.4);
  }
  .prog span{font-size:12px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .prog span b{color:var(--yellow);font-weight:700}

  /* 顶部细进度线：后台下载环境时，不管停在哪个页签都看得见 */
  .gbar{
    position:fixed;top:0;left:0;right:0;height:2px;z-index:200;
    background:transparent;opacity:0;transition:opacity .35s;pointer-events:none;
  }
  .gbar.on{opacity:1}
  .gbar i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,#2f7fbf,var(--yellow));
    box-shadow:0 0 8px rgba(255,212,59,.55);
    transition:width .18s linear;
  }
  .engine{
    display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);
    padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel2);white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);transition:.3s}
  .dot.loading{background:var(--warn);animation:pulse 1.1s infinite}
  .dot.ready{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.fail{background:var(--bad)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* 右上角菜单 */
  .menu-wrap{position:relative;flex-shrink:0}
  .menu-btn{
    width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
    background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
    font-size:16px;line-height:1;cursor:pointer;padding-bottom:6px;
  }
  .menu-btn:hover{background:#16202b;color:var(--ink);border-color:var(--line2)}
  .menu-pop{
    position:absolute;right:0;top:38px;z-index:50;min-width:168px;padding:6px;
    background:#152130;border:1px solid var(--line2);border-radius:10px;
    box-shadow:0 16px 40px rgba(0,0,0,.55);animation:pop .16s ease-out;
  }
  .menu-pop button{
    display:block;width:100%;text-align:left;padding:8px 11px;border-radius:6px;
    background:transparent;border:0;color:var(--ink2);font:inherit;font-size:12.5px;cursor:pointer;
  }
  .menu-pop button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .menu-pop button.danger:hover{background:rgba(255,95,87,.14);color:#ff8a84}
  .menu-pop .sep{height:1px;background:var(--line);margin:5px 4px}

  /* ---------- 布局 ---------- */
  .layout{display:grid;grid-template-columns:246px 1fr;height:calc(100vh - 62px);overflow:hidden}
  nav{
    border-right:1px solid var(--line);overflow-y:auto;padding:13px 10px 32px;
    background:linear-gradient(180deg,rgba(13,20,27,.7),rgba(11,15,20,.2));
  }
  nav::-webkit-scrollbar,.pane::-webkit-scrollbar,.term::-webkit-scrollbar{width:9px;height:9px}
  nav::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb,.term::-webkit-scrollbar-thumb{background:#24323f;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  .ch{margin-bottom:12px}
  .ch-h{display:flex;align-items:center;gap:8px;padding:0 6px 5px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);font-weight:600}
  .ch-h em{font-style:normal;color:var(--ink3);margin-left:auto;font-size:10px;letter-spacing:0;opacity:.85}
  .lv{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:5px 8px;border-radius:8px;border:1px solid transparent;background:transparent;
    color:var(--ink2);font:inherit;font-size:12px;cursor:pointer;transition:.16s;margin-bottom:1px;
  }
  .lv:hover:not(.lock){background:rgba(75,159,225,.09);border-color:rgba(75,159,225,.22);color:var(--ink)}
  .lv .n{
    width:20px;height:20px;border-radius:5px;flex-shrink:0;display:grid;place-items:center;
    font-size:10px;font-weight:700;font-family:var(--mono);
    background:#0a1017;border:1px solid var(--line2);color:var(--ink3);
  }
  .lv.done .n{background:rgba(63,209,90,.16);border-color:rgba(63,209,90,.5);color:var(--ok)}
  .lv.lock{opacity:.38;cursor:not-allowed}
  .lv.active{background:rgba(255,212,59,.10);border-color:rgba(255,212,59,.42);color:var(--yellow)}
  .lv.active .n{background:rgba(255,212,59,.18);border-color:rgba(255,212,59,.6);color:var(--yellow)}
  .lv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 主区 ---------- */
  main{display:grid;grid-template-columns:1fr 380px;grid-template-rows:100%;overflow:hidden;min-width:0;min-height:0}
  .pane{overflow-y:auto;min-width:0;min-height:0}
  .left{padding:22px 26px 40px;min-height:0}
  .right{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel2);min-height:0}

  .kick{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .tag{
    font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;
    padding:3px 9px;border-radius:5px;background:rgba(75,159,225,.14);color:#7dc0f0;border:1px solid rgba(75,159,225,.28);
  }
  .tag.boss{background:rgba(255,95,87,.14);color:#ff8a84;border-color:rgba(255,95,87,.32)}
  .tag.done{background:rgba(63,209,90,.14);color:#6fe084;border-color:rgba(63,209,90,.3)}
  h2{font-size:23px;font-weight:700;letter-spacing:.2px;margin-bottom:6px}
  .goal{color:var(--ink2);font-size:13.5px;margin-bottom:16px}
  .goal code{font-family:var(--mono);font-size:12.5px;background:rgba(255,212,59,.10);color:var(--yellow);padding:1.5px 5px;border-radius:4px}

  .expect{
    border:1px solid var(--line);border-radius:11px;background:var(--panel);
    padding:11px 14px;margin-bottom:16px;
  }
  .expect h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;font-weight:700}
  .expect pre{font-family:var(--mono);font-size:12.5px;color:#a9e5b8;line-height:1.65;white-space:pre-wrap;word-break:break-all}

  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:0;transition:.16s}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;
    font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line2);color:var(--ink2);
  }
  .btn:hover{background:#16202b;color:var(--ink);border-color:#3a4d61}
  .btn:active{transform:translateY(1px)}
  .btn.run{
    background:linear-gradient(180deg,#ffe066,var(--yellow));color:#1a1500;border-color:#e6ba1f;
    box-shadow:0 3px 14px rgba(255,212,59,.22);
  }
  .btn.run:hover{background:linear-gradient(180deg,#ffe985,#ffd93b);color:#1a1500}
  .btn.run:disabled{opacity:.5;cursor:wait;box-shadow:none}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);font-weight:500;padding:8px 10px}
  .btn.ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  kbd{font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.3);padding:1px 5px;border-radius:4px;opacity:.72}

  /* ---------- 编辑器 ---------- */
  .editor{
    display:grid;grid-template-columns:44px 1fr;border:1px solid var(--line2);border-radius:12px;
    overflow:hidden;background:#0a0f15;position:relative;height:300px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .editor:focus-within{border-color:#3d6a92;box-shadow:0 0 0 3px rgba(75,159,225,.10)}
  .gutter{
    padding:14px 0;text-align:right;font-family:var(--mono);font-size:13px;line-height:1.62;
    color:#3d4f62;background:#080c11;border-right:1px solid #16202b;
    overflow:hidden;user-select:none;white-space:pre;
  }
  .gutter b{display:block;padding-right:11px;font-weight:400}
  .code-area{position:relative;overflow:hidden}
  #hl,#code{
    font-family:var(--mono);font-size:13px;line-height:1.62;
    padding:14px 16px 14px 14px;border:0;margin:0;white-space:pre;tab-size:4;
    letter-spacing:0;
  }
  #hl{position:absolute;inset:0;overflow:auto;pointer-events:none;color:#c6d4e2}
  #hl::-webkit-scrollbar{display:none}
  #hl::-webkit-scrollbar-thumb{display:none}
  #code{
    position:absolute;inset:0;width:100%;height:100%;resize:none;outline:0;background:transparent;
    color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--yellow);
    overflow:auto;font-family:var(--mono);
  }
  #code::selection{background:rgba(75,159,225,.28);-webkit-text-fill-color:transparent}
  .c-kw{color:#ff7ab2}
  .c-str{color:#9ce38a}
  .c-num{color:#ffbe5c}
  .c-com{color:#4f6580;font-style:italic}
  .c-fn{color:#79c0ff}

  /* ---------- 右栏：运行结果 ---------- */
  .rhead{
    display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);
    font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);font-weight:700;flex-shrink:0;
  }
  .rhead .spacer{flex:1}
  .verdict{
    font-size:10px;letter-spacing:.6px;padding:2px 8px;border-radius:99px;text-transform:none;
    background:rgba(255,255,255,.05);color:var(--ink3);font-weight:600;
  }
  .verdict.ok{background:rgba(63,209,90,.16);color:var(--ok)}
  .verdict.bad{background:rgba(255,95,87,.16);color:var(--bad)}
  .term{
    flex:1;min-height:0;overflow-y:auto;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.7;
    color:#a9bccf;white-space:pre-wrap;word-break:break-word;
  }
  .term .ph{color:var(--ink3);font-family:var(--sans);font-size:12.5px;line-height:1.75}
  .term .err{color:#ff8a84}
  .term .hint-line{color:var(--warn)}

  /* 依赖加载进度 */
  .loadbar{
    height:7px;background:#0a0e13;border:1px solid var(--line);border-radius:99px;
    overflow:hidden;margin:12px 0 7px;
  }
  .loadbar i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#2f7fbf,var(--yellow));
    transition:width .35s cubic-bezier(.22,1,.36,1);
    box-shadow:0 0 10px rgba(255,212,59,.35);
  }
  .loadmsg{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.2px}

  /* 结果卡 */
  .rescard{border-radius:11px;padding:12px 14px;margin-bottom:10px;border:1px solid;animation:pop .3s cubic-bezier(.22,1.4,.4,1)}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .rescard.ok{background:rgba(63,209,90,.09);border-color:rgba(63,209,90,.35)}
  .rescard.bad{background:rgba(255,95,87,.08);border-color:rgba(255,95,87,.32)}
  .rescard .ttl{font-family:var(--sans);font-weight:700;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .rescard.ok .ttl{color:var(--ok)}
  .rescard.bad .ttl{color:#ff8a84}
  .diff{font-family:var(--sans);font-size:11.5px;color:var(--ink3);display:block;margin-bottom:8px}
  .cmp{display:grid;gap:6px}
  .cmp .row{font-family:var(--mono);font-size:12px;padding:5px 9px;border-radius:6px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
  .cmp .row.got{background:rgba(255,95,87,.09);color:#ffb3ae;border-left:2px solid #ff5f57}
  .cmp .row.exp{background:rgba(63,209,90,.09);color:#a9e5b8;border-left:2px solid var(--ok)}
  .cmp .row.mute{background:rgba(255,255,255,.03);color:var(--ink3);border-left:2px solid var(--line2)}
  .cmp .lbl{font-family:var(--sans);font-size:10.5px;letter-spacing:1px;color:var(--ink3);margin-bottom:2px}

  /* 图表结果 */
  .figwrap{margin-top:11px;background:#fff;border-radius:8px;padding:7px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .figwrap img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px}

  /* 通关横幅 */
  .win{
    position:fixed;inset:0;display:grid;place-items:center;z-index:60;
    background:rgba(6,9,13,.72);backdrop-filter:blur(6px);animation:fade .25s;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win .card{
    width:min(420px,88vw);background:linear-gradient(170deg,#152130,#0d141b);
    border:1px solid rgba(255,212,59,.34);border-radius:18px;padding:30px 28px 24px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,212,59,.08) inset;
    animation:rise .38s cubic-bezier(.22,1.2,.4,1);position:relative;overflow:hidden;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
  .win .card::before{
    content:"";position:absolute;top:-60%;left:-20%;width:140%;height:120%;
    background:radial-gradient(circle at 50% 0%, rgba(255,212,59,.20), transparent 62%);pointer-events:none;
  }
  .win .star{font-size:44px;line-height:1;margin-bottom:10px;animation:spin .7s cubic-bezier(.2,1.5,.4,1)}
  @keyframes spin{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
  .win h3{font-size:20px;margin-bottom:6px;position:relative}
  .win p{font-size:13px;color:var(--ink2);margin-bottom:20px;position:relative}
  .win p b{color:var(--yellow)}
  .win .acts{display:flex;gap:9px;justify-content:center;position:relative}

  .hintbox{border:1px solid rgba(227,179,65,.3);background:rgba(227,179,65,.07);border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#e8cd8a;animation:pop .25s}
  .hintbox b{color:var(--warn);font-size:11px;letter-spacing:1px;display:block;margin-bottom:3px;text-transform:uppercase}

  /* ---------- 理论卡 ---------- */
  .tabs{display:flex;gap:4px;margin-bottom:15px;border-bottom:1px solid var(--line)}
  .tab{
    padding:9px 18px;font-size:12.5px;font-weight:600;color:var(--ink3);background:transparent;
    border:0;border-bottom:2px solid transparent;cursor:pointer;border-radius:7px 7px 0 0;margin-bottom:-1px;
    display:flex;align-items:center;gap:7px;font-family:var(--sans);
  }
  .tab:hover{color:var(--ink2);background:rgba(255,255,255,.035)}
  .tab.active{color:var(--yellow);border-bottom-color:var(--yellow);background:rgba(255,212,59,.06)}
  .tab .cnt{font-size:10px;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:99px;color:var(--ink3);font-weight:600}
  .tab.active .cnt{background:rgba(255,212,59,.16);color:var(--yellow)}
  .tabpane.hidden{display:none}
  .gocode{
    width:100%;justify-content:center;margin-top:10px;padding:11px;font-size:13px;font-weight:700;
    background:linear-gradient(180deg,rgba(255,212,59,.14),rgba(255,212,59,.06));
    border:1px solid rgba(255,212,59,.32);color:var(--yellow);border-radius:9px;
  }
  .gocode:hover{background:linear-gradient(180deg,rgba(255,212,59,.24),rgba(255,212,59,.12));border-color:rgba(255,212,59,.5)}
  .theory{margin-bottom:4px}
  .th-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .th-head>span{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .th-head>span i{font-style:normal;color:var(--ink3);opacity:.7}
  .th-head .btn{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:6px}
  .tcard{
    border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;
    background:linear-gradient(180deg,rgba(75,159,225,.05),rgba(18,26,36,.45));
    transition:border-color .18s;
  }
  .tcard:hover{border-color:#31465b}
  .tcard h5{font-size:12.5px;font-weight:700;color:#9fd0f5;margin-bottom:5px;display:flex;gap:7px;align-items:baseline;line-height:1.5}
  .tcard h5::before{content:"▸";color:var(--blue);font-size:10px;flex-shrink:0}
  .tcard p{font-size:12.5px;color:var(--ink2);line-height:1.8}
  .tcard p code{font-family:var(--mono);font-size:11.5px;background:rgba(255,212,59,.11);color:var(--yellow);padding:1px 4px;border-radius:3px;white-space:nowrap}
  .tcard p b{color:var(--ink);font-weight:600}
  .snippet{margin-top:9px;border:1px solid #16202b;border-radius:8px;background:#080d12;overflow:hidden}
  .snippet pre{font-family:var(--mono);font-size:12px;line-height:1.6;padding:9px 12px;white-space:pre-wrap;word-break:break-word;color:#c6d4e2}
  .sn-bar{display:flex;align-items:center;gap:8px;padding:6px 9px;border-top:1px solid #16202b;background:rgba(255,255,255,.02);flex-wrap:wrap}
  .btn.tiny{font-size:10.5px;padding:3px 9px;border-radius:6px;background:rgba(75,159,225,.13);border:1px solid rgba(75,159,225,.32);color:#8cc7ee;font-weight:600;letter-spacing:0}

function renderTheory(lv){
  const list = THEORY[lv.id];
  if(!list || !list.length) return '';
  let h = '<div class="theory" id="theory">';
  h += '<div class="th-head"><span>📖 本关知识 <i>· 先读，再跑示例，最后动手</i></span>';
  h += '<button class="btn ghost" id="thToggle">收起</button></div>';
  list.forEach((t, i) => {
    h += '<div class="tcard"><h5>' + t.h + '</h5><p>' + t.p + '</p>';
    if(t.code){
      h += '<div class="snippet"><pre>' + highlightPython(t.code) + '</pre>';
      h += '<div class="sn-bar">';
      h += '<button class="btn tiny" data-sn="' + i + '">▶ 运行看效果</button>';
      h += '<button class="btn tiny alt" data-fill="' + i + '">↧ 抄进编辑器</button>';
      h += '<span class="sn-out"></span>';
      h += '</div>';
      h += '<div class="sn-fig"></div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '<button class="btn gocode" id="goCode">读完了，去写代码 →</button>';
  h += '</div>';
  return h;
}

function bindTheory(lv){
  const box = document.getElementById('theory');
  if(!box) return;
  const tg = document.getElementById('thToggle');
  tg.addEventListener('click', () => {
    box.classList.toggle('folded');
    tg.textContent = box.classList.contains('folded') ? '展开' : '收起';
  });

  const go = document.getElementById('goCode');
  if(go) go.addEventListener('click', () => {
    const t = leftEl.querySelector('.tab[data-tab="code"]');
    if(t) t.click();
    leftEl.scrollTop = 0;
  });

  box.addEventListener('click', async e => {
    const btn = e.target.closest('[data-sn],[data-fill]');
    if(!btn) return;

    if(btn.dataset.sn !== undefined){
      const t = THEORY[lv.id][+btn.dataset.sn];
      const out = btn.parentElement.querySelector('.sn-out');
      if(!out) return;
      out.textContent = '运行中…';
      out.style.color = '';
      try{
        // 数据示例要先备好包和数据文件
        if(t.packages && t.packages.length){
          if(!pyodide) await bootEngine();
          const missing = t.packages.filter(p => !loadedPkgs.has(p));
          if(missing.length){
            out.textContent = '首次加载 ' + missing.join('、') + '，稍等…';
            await ensurePackages(t.packages);
          }
        }
        if(t.data && t.data.length) await injectDataFiles(t.data);
        const r = await runPython(t.code, t.packages ? 20 : 3);
        if(r.err && r.err.trim()){
          const last = r.err.trim().split('\n').filter(Boolean).pop();
          out.innerHTML = '<span class="sn-err">✕ ' + escHtml(last) + '</span>';
        }else{
          const txt = r.out.replace(/\s+$/, '');
          out.innerHTML = '<span class="sn-arrow">→ </span>' + escHtml(txt ? txt.split('\n').join('  ｜  ') : '(什么都没打印)');
          // 画图示例：把图也显示出来
          const figBox = btn.closest('.snippet').querySelector('.sn-fig');
          const figSrc = figBox ? await renderAnyFigure() : null;
          if(figBox && figSrc){
            figBox.innerHTML = '<div class="figwrap"><img src="' + figSrc + '" alt="示例图"></div>';
          }
        }
      }catch(err){
        out.innerHTML = '<span class="sn-err">引擎还没就绪，等右上角变绿</span>';
      }
      return;
    }

    // 抄进编辑器
    const t = THEORY[lv.id][+btn.dataset.fill];
    const ta = document.getElementById('code');
    ta.value = t.code;
    persistCode(lv.id, t.code);
    syncEditor();
    ta.focus();
    ta.scrollIntoView({ behavior:'smooth', block:'center' });
    toast('已写入编辑器，改一改再运行');
  });
}

function bindTabs(lv){
  const tabs = Array.from(leftEl.querySelectorAll('.tab'));
  if(!tabs.length) return;
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(x => x.classList.toggle('active', x === tab));
    const learn = document.getElementById('pane-learn');
    const code = document.getElementById('pane-code');
    if(learn) learn.classList.toggle('hidden', tab.dataset.tab !== 'learn');
    if(code) code.classList.toggle('hidden', tab.dataset.tab !== 'code');
    if(tab.dataset.tab === 'code'){
      requestAnimationFrame(() => {
        syncEditor();
        const ta = document.getElementById('code');
        if(ta && tab.dataset.auto !== 'off') ta.focus();
      });
    }
  }));
}

function toast(msg){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1900);
}

const STORE_KEY = 'pyquest.v1';
let state = { cleared: {}, current: LEVELS[0].id, hints: {} };

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.cleared) state = Object.assign(state, s);
    }
  }catch(e){ /* 隐私模式可能禁写，忽略 */ }
  if(!LEVELS.some(l => l.id === state.current)) state.current = LEVELS[0].id;
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

const CDN_LIST = [
  'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/',
  'https://gcore.jsdelivr.net/pyodide/v0.26.4/full/',
  'https://fastly.jsdelivr.net/pyodide/v0.26.4/full/'
];

let pyodide = null;
let engineState = 'idle'; // idle | loading | ready | fail
let engineBase = null;    // 运行时来源目录，wheel 预取要用
let engineLabel = 'Python 3 · 内置';
let loadTicker = null, loadStart = 0;

function startLoadTicker(){
  if(loadTicker) return;
  loadStart = Date.now();
  loadTicker = setInterval(() => {
    if(engineState !== 'loading') return;
    const s = (Date.now() - loadStart) / 1000;
    const txt = document.getElementById('engineText');
    if(!txt) return;
    if(s < 3) txt.textContent = '正在唤醒 Python…';
    else if(s < 10) txt.textContent = '加载运行时 ' + s.toFixed(0) + 's';
    else if(s < 25) txt.textContent = '加载运行时 ' + s.toFixed(0) + 's（约 13MB）';
    else txt.textContent = '网络较慢，已 ' + s.toFixed(0) + 's · 可先读理论';
  }, 500);
}
function stopLoadTicker(){
  clearInterval(loadTicker);
  loadTicker = null;
}

const PREAMBLE = [
  'import io, sys, time, traceback',
  'class __CheckFailed(Exception):',
  '    pass',
  'def chk(cond, msg="结果不符合预期"):',
  '    if not cond:',
  '        raise __CheckFailed(msg)',
  '__buf = io.StringIO()',
  '__old = sys.stdout',
  '__deadline = time.time() + __limit',
  'def __guard(frame, event, arg):',
  '    if time.time() > __deadline:',
  '        raise TimeoutError("运行超过 " + str(int(__limit)) + " 秒仍未结束，检查是不是死循环")',
  '    return __guard',
  '__err = ""',
  '__exited = False',
  '__g = {"__name__": "__main__"}',
  'try:',
  '    sys.stdout = __buf',
  '    sys.settrace(__guard)',
  '    exec(compile(__src, "<你的代码>", "exec"), __g)',
  'except TimeoutError as e:',
  '    __err = "\\u23f1 " + str(e)',
  'except SystemExit:',
  '    __exited = True',
  'except BaseException:',
  '    __err = traceback.format_exc(limit=2)',
  'finally:',
  '    sys.settrace(None)',
  '    sys.stdout = __old',
  '__g["chk"] = chk',
  '__res_out = __buf.getvalue()',
  '__res_err = __err',
  '__res_exited = __exited'
].join('\n');

// check 模式：用户代码跑完后，在同一个命名空间里跑断言
const CHECK_PREAMBLE = [
  'import traceback',
  '__check_ok = False',
  '__check_msg = ""',
  '__cbuf = io.StringIO()',
  '__cold = sys.stdout',
  'try:',
  '    sys.stdout = __cbuf',
  '    exec(compile(__check_src, "<check>", "exec"), __g)',
  '    __check_ok = True',
  'except __CheckFailed as e:',
  '    __check_msg = str(e)',
  'except BaseException:',
  '    __check_msg = traceback.format_exc(limit=2)',
  'finally:',
  '    sys.stdout = __cold',
  '__check_out = __cbuf.getvalue()'
].join('\n');

function setEngine(s, text){
  engineState = s;
  const dot = document.getElementById('dot');
  const txt = document.getElementById('engineText');
  dot.className = 'dot ' + (s === 'ready' ? 'ready' : s === 'loading' ? 'loading' : s === 'fail' ? 'fail' : '');
  txt.textContent = text;
}

function injectScript(src){
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = src;
    sc.onload = res;
    sc.onerror = () => rej(new Error('script load failed'));
    document.head.appendChild(sc);
  });
}

let bootPromise = null;

function bootEngine(){
  if(engineState === 'ready') return Promise.resolve(true);
  if(bootPromise) return bootPromise;
  bootPromise = doBoot().then(ok => { if(!ok) bootPromise = null; return ok; });
  return bootPromise;
}

async function doBoot(){
  setEngine('loading', '正在唤醒 Python…');
  startLoadTicker();
  const tBoot = Date.now();

  // 本地运行时优先（同目录 pyodide/），拿不到再走 CDN
  let localBase = null;
  try{ localBase = new URL('pyodide/', location.href).href; }catch(e){}
  const bases = [];
  if(localBase) bases.push(localBase);
  Array.prototype.push.apply(bases, CDN_LIST);

  for(const base of bases){
    try{
      if(!window.loadPyodide) await injectScript(base + 'pyodide.js');
      if(!window.loadPyodide) throw new Error('loadPyodide undefined');
      pyodide = await window.loadPyodide({ indexURL: base });
      // 预热一次，别把首次导入的耗时算进用户代码的超时
      pyodide.runPython('import io, sys, time, traceback');
      stopLoadTicker();
      const local = (base === localBase);
      engineBase = base;
      engineLabel = local ? 'Python 3 · 内置' : 'Python 3 就绪';
      setEngine('ready', engineLabel);
      console.info('[pyquest] 引擎来源: ' + base);
      if(!local && Date.now() - tBoot > 8000){
        setTimeout(() => toast('引擎已就绪 · 双击「启动游戏.bat」可离线秒开'), 600);
      }
      return true;
    }catch(err){
      console.warn('[pyquest] 引擎源不可用: ' + base + ' — ' + (err && err.message));
      window.loadPyodide = undefined;
    }
  }

  stopLoadTicker();
  pyodide = null;
  setEngine('fail', '引擎未加载');
  return false;
}

async function runPython(code, limit){
  if(!pyodide){
    await bootEngine();
    if(!pyodide) throw new Error('OFFLINE');
  }
  pyodide.globals.set('__src', code);
  pyodide.globals.set('__limit', Number(limit) || 3);
  pyodide.runPython(PREAMBLE);
  const out = pyodide.globals.get('__res_out');
  const err = pyodide.globals.get('__res_err');
  const exited = pyodide.globals.get('__res_exited');
  try{ pyodide.globals.delete?.('__src'); }catch(e){}
  return { out: String(out || ''), err: String(err || ''), exited: !!exited };
}

async function collectReport(){

    ].join('\n'));
    const s = String(pyodide.globals.get('__rep_json') || '');

  return { report: obj, fig: fig };
}

/* ---------- 数据关：包加载 / 数据注入 / 断言判题 ---------- */

const loadedPkgs = new Set();
const injectedFiles = new Set();

// 各包实际大小（MB），用来算加载进度——按包数算不准，matplotlib 一个顶十个
const PKG_SIZE = {
  'matplotlib': 15.01, 'matplotlib-pyodide': 0.07, 'pillow': 2.90, 'fonttools': 4.07,
  'kiwisolver': 0.13, 'pyparsing': 0.38, 'packaging': 0.19, 'cycler': 0.02,
  'pandas': 22.66, 'numpy': 11.41, 'python-dateutil': 0.42, 'pytz': 1.03, 'six': 0.04
};

function pqError(type, msg, cause){
  const e = new Error(msg);
  e.pqType = type;
  if(cause) e.cause = cause;
  return e;
}

/* 加载进度：顶栏、顶部细线、结果面板共用一份状态 */

let pkgLoading = null;          // { frac, msg }
let pkgPromise = null;
let lockPkgs = null;            // pyodide-lock.json 里的 packages，false = 取不到

function fmtMB(n){ return (n || 0).toFixed(1); }

function renderPkgProgress(){
  if(!pkgLoading) return;
  const pct = Math.round(pkgLoading.frac * 100);

  const bar = document.getElementById('pkgBar');
  if(bar) bar.style.width = pct + '%';
  const txt = document.getElementById('pkgText');
  if(txt) txt.textContent = pkgLoading.msg;

  const gf = document.getElementById('gbarFill');
  if(gf) gf.style.width = pct + '%';
  const gb = document.getElementById('gbar');
  if(gb) gb.classList.toggle('on', pct < 100);

  const et = document.getElementById('engineText');
  if(et && pkgLoading.frac < 1) et.textContent = '加载 ' + pct + '%';
}

function setPkgProgress(frac, msg){
  pkgLoading = { frac: Math.max(0, Math.min(1, frac)), msg: msg || '' };
  renderPkgProgress();
}

function clearPkgProgress(){
  pkgLoading = null;
  const gb = document.getElementById('gbar');
  if(gb) gb.classList.remove('on');
}

/* 从 lock 里读包清单：文件名和体积都是准的，不用估 */
async function getLock(){
  if(lockPkgs !== null) return lockPkgs;
  if(!engineBase || location.protocol === 'file:'){ lockPkgs = false; return lockPkgs; }
  try{
    const res = await fetch(engineBase + 'pyodide-lock.json', { cache: 'force-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    lockPkgs = (j && j.packages) ? j.packages : false;
  }catch(err){
    console.warn('[pyquest] 读不到 pyodide-lock.json，进度按包估算：', err && err.message);
    lockPkgs = false;
  }
  return lockPkgs;
}

function resolveWheels(pkgs, names){
  const out = [], seen = new Set(), stack = names.slice();
  while(stack.length){
    const n = stack.pop();
    if(seen.has(n)) continue;
    const p = pkgs[n];
    if(!p || !p.file_name) continue;
    seen.add(n);
    out.push({ name: n, file: p.file_name, mb: (p.size || 0) / 1048576 });
    (p.depends || []).forEach(d => stack.push(d));
  }
  return out;
}

/* ---------- wheel 本地缓存（IndexedDB） ----------
   GitHub Pages 只给 10 分钟缓存，隔天再来那 58MB 得重新下。
   自己存一份：第一次还是下，之后直接读本地，几百毫秒。 */

const IDB_NAME = 'pyquest-assets';
const IDB_STORE = 'wheels';
let idbPromise = null;

function idbOpen(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise(resolve => {
    if(!window.indexedDB){ resolve(null); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ resolve(null); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
  });
  return idbPromise;
}

async function idbGet(key){
  const db = await idbOpen();
  if(!db) return null;
  return new Promise(resolve => {
    let r;
    try{ r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key); }
    catch(e){ resolve(null); return; }
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => resolve(null);
  });
}

async function idbDel(keys){
  if(!keys || !keys.length) return;
  const db = await idbOpen();
  if(!db) return;
  try{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    keys.forEach(k => tx.objectStore(IDB_STORE).delete(k));
  }catch(e){ /* 删不掉就算了，不影响使用 */ }
}

async function idbPut(key, buf){
  const db = await idbOpen();
  if(!db) return false;
  return new Promise(resolve => {
    let tx;
    try{ tx = db.transaction(IDB_STORE, 'readwrite'); }
    catch(e){ resolve(false); return; }
    try{ tx.objectStore(IDB_STORE).put(buf, key); }catch(e){ resolve(false); return; }
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
    tx.onabort = () => resolve(false);
  });
}

/* Pyodide 只在整包装完时发一条消息，直接等它进度条会长时间停在 0。
   这里自己按字节流拉一遍 wheel，边下边报进度；后面 loadPackage 直接走浏览器缓存。 */

// lock 里不一定带 size（0.26.4 就没有），先用 PKG_SIZE 表，查不到再 HEAD 探一次
async function wheelSizeMB(name, url){
  if(PKG_SIZE[name] > 0) return PKG_SIZE[name];
  try{
    const res = await fetch(url, { method: 'HEAD', cache: 'force-cache' });
    if(res.ok){
      const len = parseInt(res.headers.get('content-length') || '0', 10);
      if(len > 0) return len / 1048576;
    }
  }catch(e){ /* 探不到就按 0 处理，进度按剩余字节摊 */ }
  return 0;
}

async function doLoadPkgs(need){
  // 先把每个 wheel 的声明体积凑齐：lock 里没有 size 字段，靠 PKG_SIZE 表，查不到再 HEAD 探
  let wheels = [];
  try{
    const pkgs = await getLock();
    if(pkgs){
      wheels = resolveWheels(pkgs, need);
      for(const w of wheels){
        if(!(w.mb > 0)) w.mb = await wheelSizeMB(w.name, engineBase + w.file);
      }
    }
  }catch(e){
    console.warn('[pyquest] 拿不到包清单，进度退回按包估算：', e && e.message);
  }

  const totalBytes = wheels.reduce((s, w) => s + w.mb * 1048576, 0);
  const totalMB = totalBytes / 1048576;

  setPkgProgress(0.01, '准备中…');

  /* 为什么自己下：Pyodide 只在"整包装完"时才发一条消息，而且它驱动下载时会占住主线程，
     进度条根本没法更新——等它下完就是一跳到 100%。
     所以这里顺着依赖顺序自己拉，边拉边报字节；拉到的内容塞进内存，
     装载时直接把这些字节还给它，不会多下一遍。 */
  const byteCache = new Map();       // url -> Uint8Array
  let doneBytes = 0, lastPaint = 0;

  const paint = (w, cur, force) => {
    const now = Date.now();
    if(!force && now - lastPaint < 80) return;
    lastPaint = now;
    const got = doneBytes + cur;
    const frac = totalBytes > 0 ? 0.02 + 0.90 * Math.min(1, got / totalBytes) : 0.06;
    setPkgProgress(frac, '正在下载 ' + w.name + '（' + fmtMB(w.mb) + 'MB） · 总进度 '
      + fmtMB(got / 1048576) + ' / ' + fmtMB(totalMB) + ' MB');
  };

  let fromCache = 0;
  const cachedFiles = [];       // 记下这次用了哪些缓存，万一装载失败就清掉让下次重下
  const writes = [];            // 落盘任务，装载前等它们写完，别被关窗口截断
  for(const w of wheels){
    const url = engineBase + w.file;
    const expect = w.mb * 1048576;

    // 本地存过就直接用，不碰网络
    const hit = await idbGet(w.file);
    // 长度核对：PKG_SIZE 只有两位小数，小包（比如 0.0657MB 写成 0.07）相对误差能到 6%，
    // 但差的绝对量很小；真正要防的是当初没下完整（曾经只剩 5.3MB 那种），差的是几十 MB。
    // 所以取「64KB 或 2%」里更宽松的那个当容差。
    const diffBytes = hit ? Math.abs(hit.byteLength - expect) : Infinity;
    const nearExpect = expect > 0 && diffBytes <= Math.max(65536, expect * 0.02);
    if(hit && hit.byteLength > 0 && (expect <= 0 || nearExpect)){
      byteCache.set(url, new Uint8Array(hit));
      cachedFiles.push(w.file);
      doneBytes += hit.byteLength;
      fromCache++;
      if(fromCache === 1 && wheels.length > 1){
        setPkgProgress(0.05, '从本地缓存读取运行环境…');
      }
      continue;
    }

    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      paint(w, 0, true);

      let cur = 0;
      if(res.body && typeof res.body.getReader === 'function'){
        const reader = res.body.getReader();
        const chunks = [];
        for(;;){
          const r = await reader.read();
          if(r.done) break;
          chunks.push(r.value);
          cur += r.value.length;
          paint(w, Math.min(cur, expect));
        }
        const buf = new Uint8Array(cur);
        let off = 0;
        for(const c of chunks){ buf.set(c, off); off += c.length; }
        byteCache.set(url, buf);
      }else{
        const buf = new Uint8Array(await res.arrayBuffer());
        cur = buf.length;
        byteCache.set(url, buf);
        paint(w, Math.min(cur, expect), true);
      }
      doneBytes += expect;

      // 存一份，下次不用重下。失败无所谓（配额满 / 隐私模式），下次照常下
      const saved = byteCache.get(url);
      if(saved) writes.push(idbPut(w.file, saved.buffer));
    }catch(err){
      // 某个包没拉到就算了，装载阶段它会自己再下（慢一点，但不会坏）
      console.warn('[pyquest] 预取 ' + w.name + ' 失败：', err && err.message);
      doneBytes += expect;
    }
  }

  if(writes.length){
    setPkgProgress(0.92, '正在缓存到本地…');
    await Promise.all(writes);
  }

  setPkgProgress(0.93, '正在装载环境…');

  // 装载：命中内存的直接还字节，剩下的走正常网络
  const origFetch = window.fetch;
  window.fetch = function(input, init){
    const url = (typeof input === 'string') ? input
              : (input && typeof input.url === 'string') ? input.url
              : String(input || '');
    const hit = byteCache.get(url);
    if(hit){
      return Promise.resolve(new Response(hit, {
        status: 200,
        headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(hit.length) }
      }));
    }
    return origFetch.call(this, input, init);
  };

  // 兜底：万一预取整段没走通，按包估算也得让用户看到在动
  const counted = new Set();
  let doneEst = 0;
  const totalEst = need.reduce((s, p) => s + (PKG_SIZE[p] || 0.5), 0);
  const tickEst = () => {
    if(wheels.length) return;
    const frac = 0.02 + 0.88 * Math.min(1, doneEst / totalEst);
    setPkgProgress(frac, '已下载 ' + fmtMB(doneEst) + ' / ' + fmtMB(totalEst) + ' MB');
  };

  try{
    await pyodide.loadPackage(need, {
      messageCallback: (msg) => {
        const m = /^Loaded (.+)$/.exec(msg);
        if(m){
          m[1].split(',').forEach(name => {
            const p = name.trim();
            if(!counted.has(p)){ counted.add(p); doneEst += (PKG_SIZE[p] || 0.2); }
          });
        }
        tickEst();
      },
      errorCallback: (msg) => { console.warn('[pyquest] pkg:', msg); }
    });
  }catch(err){
    // 装载失败有可能是缓存里的包坏了，把这次用到的缓存清掉，下次重新下
    if(cachedFiles.length) idbDel(cachedFiles);
    clearPkgProgress();
    throw pqError('PACKAGE', need.join('、'), err);
  }finally{
    window.fetch = origFetch;
  }

  need.forEach(p => loadedPkgs.add(p));
  setPkgProgress(1, '就绪');
  setTimeout(() => {
    clearPkgProgress();
    const et = document.getElementById('engineText');
    if(et && engineState === 'ready') et.textContent = engineLabel;
  }, 700);
}

async function ensurePackages(list){
  if(!list || !list.length) return;
  // 已经有一批在装，等它装完再判断还缺什么
  if(pkgPromise){ await pkgPromise.catch(() => {}); }
  const need = list.filter(p => !loadedPkgs.has(p));
  if(!need.length) return;

  pkgPromise = doLoadPkgs(need);
  try{
    await pkgPromise;
  }finally{
    pkgPromise = null;
  }
}

function warmUpPandas(){

  try{

/* 进关卡就开始准备，把下载时间藏进"读理论卡"那几分钟里 */
async function preloadLevel(lv){
  if(!lv || !lv.packages || !lv.packages.length) return;
  if(!pyodide){
    bootEngine().then(() => { if(pyodide) preloadLevel(lv); }).catch(() => {});
    return;
  }

  const missingPkgs = lv.packages.filter(p => !loadedPkgs.has(p));
  const missingFiles = (lv.dataFiles || []).filter(f => !injectedFiles.has(f));
  const needFont = lv.packages.indexOf('matplotlib') >= 0 && !mplReady;
  if(!missingPkgs.length && !missingFiles.length && !needFont) return;

  showLoadCard();

  try{
    await ensurePackages(lv.packages);
    await injectDataFiles(lv.dataFiles || []);
    if(lv.packages.indexOf('pandas') >= 0) warmUpPandas();
    if(lv.packages.indexOf('matplotlib') >= 0) await setupMatplotlib();
    setTimeout(() => clearLoadCard(lv), 800);
  }catch(err){
    // 预加载失败不打扰用户，点「运行」时会重试并给出明确错误
    console.warn('[pyquest] 预加载没成功：', err && err.message);
    clearLoadCard(lv);
  }
}

const BINARY_RE = /\.(otf|ttf|woff2?|png|jpg|wasm)$/i;

async function injectDataFiles(paths){
  for(const p of (paths || [])){
    if(injectedFiles.has(p)) continue;
    let res;
    try{
      res = await fetch(p);
    }catch(err){
      throw pqError('DATA', p, err);
    }
    if(!res.ok) throw pqError('DATA', p + '（HTTP ' + res.status + '）');

    const full = '/home/pyodide/' + p;
    const dir = full.slice(0, full.lastIndexOf('/'));
    try{ pyodide.FS.mkdirTree(dir); }catch(e){}

    // 字体这类二进制文件不能按文本读，否则字节会被 UTF-8 解码搞坏
    if(BINARY_RE.test(p)){
      pyodide.FS.writeFile(full, new Uint8Array(await res.arrayBuffer()));
    }else{
      pyodide.FS.writeFile(full, await res.text());
    }
    injectedFiles.add(p);
  }
}

async function runCheck(checkSrc){

  pyodide.globals.set('__check_src', checkSrc);

    msg: String(pyodide.globals.get('__check_msg') || ''),
    out: String(pyodide.globals.get('__check_out') || '')
  };
}

const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const HL_RE = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+\.?\d*)\b|\b(def|return|if|elif|else|for|while|in|not|and|or|import|from|as|class|try|except|finally|with|lambda|pass|break|continue|global|del|assert|yield|None|True|False)\b|\b(print|len|range|int|str|float|list|dict|set|tuple|sum|min|max|abs|round|sorted|reversed|enumerate|zip|type|input|join|append|split|format)\b/g;

function highlightPython(src){
  let out = '', last = 0, m;
  HL_RE.lastIndex = 0;
  while((m = HL_RE.exec(src)) !== null){
    out += escHtml(src.slice(last, m.index));
    const cls = m[1] ? 'c-com' : m[2] ? 'c-str' : m[3] ? 'c-num' : m[4] ? 'c-kw' : 'c-fn';
    out += '<span class="' + cls + '">' + escHtml(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  out += escHtml(src.slice(last));
  return out + '\n';
}

/* ---------- 编辑器行为 ---------- */
function syncEditor(){
  const ta = document.getElementById('code');
  const hl = document.getElementById('hl');
  const gut = document.getElementById('gutter');
  if(!ta) return;
  hl.innerHTML = highlightPython(ta.value);
  const lines = ta.value.split('\n').length;
  let g = '';
  for(let i = 1; i <= lines; i++) g += '<b>' + i + '</b>';
  gut.innerHTML = g;
  const off = ta.scrollTop;
  hl.scrollTop = off; hl.scrollLeft = ta.scrollLeft;
  gut.scrollTop = off;
}

function persistCode(id, val){
  try{ localStorage.setItem('pyquest.code.' + id, val); }catch(e){}
}

function bindEditor(lv){
  const ta = document.getElementById('code');
  const hl = document.getElementById('hl');
  const gut = document.getElementById('gutter');

  ta.addEventListener('input', () => { syncEditor(); persistCode(lv.id, ta.value); });
  ta.addEventListener('scroll', () => {
    hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop;
  });
  ta.addEventListener('keydown', e => {
    // Ctrl/Cmd + Enter 运行
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault(); runCurrent(lv); return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      if(e.shiftKey){
        // 反缩进当前行
        const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
        const head = ta.value.slice(lineStart, s);
        if(head.startsWith('    ')){
          ta.value = ta.value.slice(0, lineStart) + ta.value.slice(lineStart + 4);
          ta.selectionStart = ta.selectionEnd = Math.max(lineStart, s - 4);
        }
      }else{
        ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
      syncEditor(); persistCode(lv.id, ta.value);
      return;
    }
    if(e.key === 'Enter'){
      e.preventDefault();
      const s = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
      const curLine = ta.value.slice(lineStart, s);
      const indent = (curLine.match(/^[ \t]*/) || [''])[0];
      const extra = /:\s*(#.*)?$/.test(curLine) ? '    ' : '';
      const ins = '\n' + indent + extra;
      ta.value = ta.value.slice(0, s) + ins + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + ins.length;
      syncEditor(); persistCode(lv.id, ta.value);
    }
  });
}

function resetTerm(lv){

    ? '这一关<b>判的是数据结构</b>，不是打印内容——把该算的结果放进 <code>result</code> 变量就行，print 不 print 都不影响。'
    : '判题方式是<b>比对标准输出</b>——程序打印的内容一字不差才算过。';
  termEl.innerHTML = '<div class="ph">点「运行」执行你的 Python 代码。<br>' + tip
    + '<br><br>快捷键 <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 运行。</div>';
}

function normalize(text){
  const lines = String(text).replace(/\r/g, '').split('\n').map(l => l.replace(/[ \t]+$/g, ''));
  while(lines.length && lines[lines.length - 1] === '') lines.pop();
  while(lines.length && lines[0] === '') lines.shift();
  return lines;
}

function firstDiff(got, exp){
  const n = Math.max(got.length, exp.length);
  for(let i = 0; i < n; i++){
    if(got[i] !== exp[i]) return i;
  }
  return -1;
}

let running = false;

// 把 Python 的报错翻译成人话。返回 null 表示没有匹配上的规则。
const ERROR_HINTS = [
  { re: /IndentationError|unexpected indent/, tip: '缩进不对。Python 靠缩进划分代码块——冒号下面那几行要统一缩进 4 个空格，不能有的多有的少。' },
  { re: /SyntaxError: invalid syntax/, tip: '语法写错了。常见原因：if / for / def 后面漏了冒号、括号没配对、或者用了中文标点（，：（））。' },
  { re: /SyntaxError: unmatched|unexpected EOF/, tip: '括号没配对，检查 ( ) 和 [ ] 是不是各有一半。' },
  { re: /NameError: name '(\w+)' is not defined/, tip: '名字没定义过，或者拼错了。检查大小写和下划线，也确认这一行是不是写在了变量定义之前。' },
  { re: /TypeError: can only concatenate str|must be str, not/, tip: '字符串和数字不能直接用 + 拼。用 str(数字) 转一下，或者用 f-string。' },
  { re: /TypeError: unsupported operand/, tip: '两个值的类型对不上，比如字符串减数字。打印一下 type() 看看它到底是什么类型。' },
  { re: /TypeError: '(\w+)' object is not callable/, tip: '这个不是函数，调用不了。检查是不是把变量名和函数名搞混了。' },
  { re: /KeyError/, tip: '字典里没有这个键。先用 in 判断一下，或者改用 .get(键, 默认值)。' },
  { re: /IndexError/, tip: '下标越界。索引从 0 开始，长度 5 的列表最大下标是 4，最后一个也可以写 -1。' },
  { re: /AttributeError: '(\w+)' object has no attribute/, tip: '这个对象没有这个属性/方法。检查拼写；如果它是列表，注意 append 是方法、len 是函数。' },
  { re: /ModuleNotFoundError|ImportError/, tip: '这个模块没装上，或者名字写错了。' },
  { re: /ZeroDivisionError/, tip: '除数是 0。除法之前先判断一下分母。' },
  { re: /RecursionError/, tip: '递归太深，多半是出口条件没写或者写错了——递归必须有能让它停下来的分支。' },
  { re: /ValueError: invalid literal for int/, tip: '这个字符串不能直接转成整数，比如 int("abc")。先确认里面是不是纯数字。' },
  { re: /ValueError/, tip: '值不合法。常见于类型转换——要转的内容格式不对。' }
];

function explainError(err){
  for(const h of ERROR_HINTS){
    if(h.re.test(err)) return h.tip;
  }
  return null;
}

async function runCurrent(lv){
  if(running) return;
  const ta = document.getElementById('code');
  const btn = document.getElementById('runBtn');
  const code = ta.value;
  if(!code.trim()){
    verdictEl.className = 'verdict bad'; verdictEl.textContent = '空代码';
    termEl.innerHTML = '<div class="ph">编辑器还是空的，先写点代码。点「提示」可以看第一句该写什么。</div>';
    return;
  }
  running = true;
  btn.disabled = true;
  btn.innerHTML = '⏳ 运行中…';

  // 窄屏：一运行就把结果区拉出来，不用手动点
  if(window.matchMedia('(max-width:1180px)').matches){
    const rp = document.querySelector('.right');
    if(rp) rp.classList.remove('collapsed');
  }

  verdictEl.className = 'verdict'; verdictEl.textContent = '运行中';
  if(!pyodide){
    termEl.innerHTML = '<div class="ph">首次运行需要先加载 Python 运行时（约 13MB），正在抓紧下载…<br>加载完成后会自动执行你这段代码，不用再点一次。</div>';
  }else{
    termEl.innerHTML = '<div class="ph">正在执行…</div>';
  }

  persistCode(lv.id, code);

  let result = null, fatal = null;
  const isCheck = lv.mode === 'check';

  try{
    // 数据关先把引擎、包、数据文件准备好
    if(!pyodide){
      verdictEl.textContent = '加载中';
      await bootEngine();
      if(!pyodide) throw new Error('OFFLINE');
    }

    if(isCheck){
      const missing = (lv.packages || []).filter(p => !loadedPkgs.has(p));
      if(pkgPromise || missing.length){
        verdictEl.textContent = '加载环境';
        termEl.innerHTML = '<div class="ph">第一次进这一章要下载运行环境，之后就是秒开。'
          + '<div class="loadbar"><i id="pkgBar" style="width:0%"></i></div>'
          + '<div class="loadmsg" id="pkgText">准备中…</div></div>';
        await new Promise(r => requestAnimationFrame(() => setTimeout(r, 20)));
        renderPkgProgress();
      }
      await ensurePackages(lv.packages || []);
      await injectDataFiles(lv.dataFiles || []);
      if((lv.packages || []).indexOf('pandas') >= 0) warmUpPandas();
      if((lv.packages || []).indexOf('matplotlib') >= 0) await setupMatplotlib();
    }

    // 先让浏览器把状态画出来，再阻塞主线程执行 Python
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 20)));
    result = await runPython(code, isCheck ? 20 : 3);
  }catch(err){
    fatal = err;
  }

  running = false;
  btn.disabled = false;
  btn.innerHTML = '▶ 运行 <kbd>Ctrl</kbd><kbd>↵</kbd>';

  if(fatal){
    const ftype = fatal.pqType || 'ENGINE';
    verdictEl.className = 'verdict bad';

    if(ftype === 'DATA'){
      verdictEl.textContent = '缺数据';
      termEl.innerHTML = '<div class="rescard bad"><div class="ttl">⚠ 数据文件读不到</div>'
        + '<div style="font-size:12.5px;color:#ffb3ae;line-height:1.8;font-family:var(--sans)">'
        + '这一关要用 <code>' + escHtml(fatal.message) + '</code>，但请求失败了。<br>'
        + '两种可能：文件被删了或改名了；或者你是直接双击 index.html 打开的——那样读不到同目录的 data/。<br>'
        + '用 <b>启动游戏.bat</b> 打开就没这个问题。'
        + '</div></div>';
      return;
    }

    if(ftype === 'PACKAGE'){
      verdictEl.textContent = '缺依赖';
      termEl.innerHTML = '<div class="rescard bad"><div class="ttl">⚠ 数据分析环境没装上</div>'
        + '<div style="font-size:12.5px;color:#ffb3ae;line-height:1.8;font-family:var(--sans)">'
        + '没能加载 <code>' + escHtml(fatal.message) + '</code>。它会先找同目录 <code>pyodide/</code> 里的 .whl 文件，找不到再去 CDN 下载。'
        + '两条路都失败了。<br>'
        + '检查一下 pyodide/ 目录里有没有 pandas 和 numpy 的 .whl，或者换个网络再试。'
        + '</div></div>';
      return;
    }

    verdictEl.textContent = '离线';
    termEl.innerHTML = '<div class="rescard bad"><div class="ttl">⚠ Python 引擎没能加载</div>'
      + '<div style="font-size:12.5px;color:#ffb3ae;line-height:1.75;font-family:var(--sans)">'
      + '这个游戏靠浏览器里的 Python 运行时（Pyodide）真正执行代码，需要约 13MB 的运行时文件。<br>'
      + '它优先读同目录 <code>pyodide/</code> 里的本地副本，读不到才去 CDN 下载——现在两条路都没走通。<br>'
      + '换个网络环境再试，或者把下面的地址在浏览器里打开一次预热缓存：<br>'
      + '<code style="display:block;margin-top:6px;color:#ffd43b;word-break:break-all">https://cdn.jsdelivr.net/pyodide/v0.26.4/full/</code>'
      + '</div></div>';
    return;
  }

  if(result.err && result.err.trim()){
    verdictEl.className = 'verdict bad';
    verdictEl.textContent = '报错';
    const tip = explainError(result.err);
    termEl.innerHTML = '<div class="rescard bad"><div class="ttl">✕ 代码报错了</div>'
      + (tip ? '<div class="hintbox" style="margin:0 0 10px"><b>可能是这个原因</b>' + escHtml(tip) + '</div>' : '')
      + '<pre class="err" style="margin:0;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word">'
      + escHtml(result.err.trim()) + '</pre></div>'
      + (result.out.trim() ? '<div class="rescard"><div class="ttl">运行期间已输出的内容</div><div class="cmp"><div class="row mute">' + escHtml(result.out.replace(/\s+$/,'')) + '</div></div></div>' : '');
    return;
  }

  // 数据关：不比对输出，跑隐藏断言
  if(isCheck){
    termEl.innerHTML = '<div class="ph">正在校验结果…</div>';
    const c = await runCheck(lv.check);
    const userOut = result.out.replace(/\s+$/, '');
    const trail = userOut
      ? '<div class="cmp" style="margin-top:9px"><div class="lbl">你的输出</div><div class="row mute">' + escHtml(userOut) + '</div></div>'
      : '';

    if(c.ok){
      verdictEl.className = 'verdict ok';
      verdictEl.textContent = '通过';
      let figHtml = '';
      let reportBtn = '';
      let okText = '所有断言都过了，图的结构是对的。';

      if(lv.report){
        const data = await collectReport();
        const html = buildReportHtml(data, code);
        window.__pqReport = html;
        okText = '全部指标都对上了，报告已经生成。';
        figHtml = data.fig
          ? '<div class="figwrap"><img src="' + data.fig + '" alt="月度走势"></div>'
          : '';
        reportBtn = '<button class="btn run" id="dlReport" style="margin-top:11px;width:100%;justify-content:center">⬇ 下载分析报告（HTML）</button>';
      }else if(lv.showFigure){
        const src = await renderFigure();
        figHtml = src
          ? '<div class="figwrap"><img src="' + src + '" alt="你画的图"></div>'
          : '<div class="hintbox">判题过了，但没能把图渲染出来——确认把 <code>fig</code> 赋给了 <code>result</code>。</div>';
      }

      termEl.innerHTML = '<div class="rescard ok"><div class="ttl">✓ 通过！</div>'
        + '<div style="font-size:12.5px;color:#a9e5b8;font-family:var(--sans);line-height:1.7">' + okText + '</div>'
        + figHtml + reportBtn + trail + '</div>';

      const dl = document.getElementById('dlReport');
      if(dl) dl.addEventListener('click', () => downloadReport(window.__pqReport));

      state.cleared[lv.id] = true;
      saveState();
      renderNav(); renderProgress();
      showWin(lv);
    }else{
      verdictEl.className = 'verdict bad';
      verdictEl.textContent = '未通过';
      const isTrace = c.msg.indexOf('Traceback') >= 0;
      let html = '<div class="rescard bad"><div class="ttl">✕ 结果不对</div>';
      if(isTrace){
        html += '<pre style="margin:0;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:#ffb3ae">'
              + escHtml(c.msg.trim()) + '</pre>';
      }else{
        html += '<div style="font-size:13px;color:#ffb3ae;line-height:1.8;font-family:var(--sans)">'
              + escHtml(c.msg) + '</div>';
      }
      html += trail + '</div>';
      termEl.innerHTML = html;
    }
    return;
  }

  const got = normalize(result.out);
  const exp = lv.expect.slice();
  const d = firstDiff(got, exp);

  if(d === -1){
    verdictEl.className = 'verdict ok';
    verdictEl.textContent = '通过';
    termEl.innerHTML = '<div class="rescard ok"><div class="ttl">✓ 通过！</div>'
      + '<div class="cmp"><div class="lbl">你的输出</div><div class="row exp">' + (escHtml(got.join('\n')) || '(无输出)') + '</div></div></div>';
    state.cleared[lv.id] = true;
    saveState();
    renderNav(); renderProgress();
    showWin(lv);
  }else{
    verdictEl.className = 'verdict bad';
    verdictEl.textContent = '未通过';
    let html = '<div class="rescard bad"><div class="ttl">✕ 输出不匹配</div>';
    html += '<span class="diff">第 ' + (d + 1) + ' 行开始不一样</span>';
    html += '<div class="cmp">';
    html += '<div><div class="lbl">你的输出' + (got.length ? '' : '（空）') + '</div>';
    if(got.length){
      got.forEach((line, i) => {
        html += '<div class="row ' + (line === exp[i] ? 'mute' : 'got') + '">' + (i === d ? '▸ ' : '  ') + escHtml(line) + '</div>';
      });
    }else{
      html += '<div class="row got">（程序什么都没打印）</div>';
    }
    html += '</div>';
    html += '<div><div class="lbl">期望输出</div>';
    exp.forEach((line, i) => {
      html += '<div class="row ' + (line === got[i] ? 'mute' : 'exp') + '">' + (i === d ? '▸ ' : '  ') + escHtml(line) + '</div>';
    });
    html += '</div></div></div>';
    if(got.length === exp.length + 1 && got[got.length - 1] === ''){
      html += '<div class="hintbox">尾部的空行不参与比对，可以忽略。</div>';
    }
    if(result.exited){
      html += '<div class="hintbox"><b>注意</b>你的代码调用了 exit() / sys.exit()，程序在那一行就结束了，后面的代码没机会执行。</div>';
    }
    termEl.innerHTML = html;
  }
}

/* ---------- 通关弹层 ---------- */
function showWin(lv){
  const idx = levelIndex(lv.id);
  const isLast = idx === LEVELS.length - 1;
  const nextId = isLast ? null : LEVELS[idx + 1].id;
  const nextLv = isLast ? null : LEVELS[idx + 1];

  const wrap = document.createElement('div');
  wrap.className = 'win';
  wrap.innerHTML = '<div class="card">'
    + '<div class="star">' + (isLast ? '👑' : '⭐') + '</div>'
    + '<h3>' + (isLast ? '全部通关了' : '关卡通过') + '</h3>'
    + '<p>' + (isLast
        ? LEVELS.length + ' 关全过。从 <b>print</b> 到 <b>merge</b> 到 <b>出报告</b>，这一圈走完了。'
        : '「<b>' + lv.title + '</b>」已完成' + (nextLv ? '<br>下一关：' + nextLv.title : '')) + '</p>'
    + '<div class="acts">'
    +   '<button class="btn ghost" data-act="stay">留在本关</button>'
    +   (lv.report ? '<button class="btn" data-act="dl">下载报告</button>' : '')
    +   (nextId ? '<button class="btn run" data-act="next">继续 →</button>' : '<button class="btn run" data-act="close">好</button>')
    + '</div></div>';
  document.body.appendChild(wrap);

  const close = () => wrap.remove();
  wrap.addEventListener('click', e => {
    if(e.target === wrap) close();
    const act = e.target.closest('[data-act]');
    if(!act) return;
    const a = act.dataset.act;
    if(a === 'stay' || a === 'close'){ close(); return; }
    if(a === 'dl'){
      if(window.__pqReport) downloadReport(window.__pqReport);
      return;
    }
    if(a === 'next'){
      close();
      state.current = nextId; saveState(); renderNav(); renderLevel();
    }
  });
  document.addEventListener('keydown', function esc(e){
    if(e.key === 'Escape'){ close(); document.removeEventListener('keydown', esc); }
  });
}

   7. 启动

loadState();
renderNav();
renderProgress();
renderLevel();

if(rheadEl){

/* ---------- 进度导出 / 导入 / 清空 ---------- */

function collectCodes(){
  const out = {};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('pyquest.code.') === 0) out[k] = localStorage.getItem(k);
  }
  return out;
}

function exportProgress(){
  const payload = {
    app: 'pyquest',
    version: 1,
    exportedAt: new Date().toISOString(),
    totalLevels: LEVELS.length,
    state: state,
    codes: collectCodes()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pyquest-progress.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  toast('进度已导出到下载文件夹');
}

function importProgress(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(String(r.result));
      if(!d || !d.state || !d.state.cleared) throw new Error('bad format');
      state = {
        cleared: d.state.cleared || {},
        current: d.state.current || LEVELS[0].id,
        hints: d.state.hints || {}
      };
      if(!LEVELS.some(l => l.id === state.current)) state.current = LEVELS[0].id;
      Object.keys(d.codes || {}).forEach(k => {
        if(k.indexOf('pyquest.code.') === 0) localStorage.setItem(k, d.codes[k]);
      });
      saveState();
      renderNav(); renderProgress(); renderLevel();
      toast('进度已导入');
    }catch(e){
      toast('导入失败：这个文件不是 PyQuest 的进度');
    }
  };
  r.readAsText(file);
}

function clearProgress(){
  if(!window.confirm('清空所有通关记录和你写过的代码？这个操作不能撤销。')) return;
  const keys = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('pyquest.') === 0) keys.push(k);
  }
  keys.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  state = { cleared: {}, current: LEVELS[0].id, hints: {} };
  renderNav(); renderProgress(); renderLevel();
  toast('已清空，从第一关重新开始');
}

function bindMenu(){
  const btn = document.getElementById('menuBtn');
  if(!btn) return;
  const wrap = btn.parentElement;

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.json,application/json';
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', () => {
    if(fileInput.files && fileInput.files[0]) importProgress(fileInput.files[0]);
    fileInput.value = '';
  });
  wrap.appendChild(fileInput);

  btn.addEventListener('click', () => {
    const old = wrap.querySelector('.menu-pop');
    if(old){ old.remove(); btn.setAttribute('aria-expanded', 'false'); return; }

    const pop = document.createElement('div');
    pop.className = 'menu-pop';
    pop.setAttribute('role', 'menu');
    pop.innerHTML = '<button role="menuitem" data-m="export">导出进度</button>'
      + '<button role="menuitem" data-m="import">导入进度</button>'
      + '<div class="sep"></div>'
      + '<button role="menuitem" class="danger" data-m="clear">清空进度</button>';
    wrap.appendChild(pop);
    btn.setAttribute('aria-expanded', 'true');

    pop.addEventListener('click', e => {
      const b = e.target.closest('[data-m]');
      if(!b) return;
      pop.remove();
      btn.setAttribute('aria-expanded', 'false');
      if(b.dataset.m === 'export') exportProgress();
      else if(b.dataset.m === 'import') fileInput.click();
      else if(b.dataset.m === 'clear') clearProgress();
    });

    const closeOnOutside = ev => {
      if(!wrap.contains(ev.target)){
        pop.remove();
        btn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', closeOnOutside);
      }
    };
    setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
  });
}

bindMenu();

// 拖窗口 / 手机横竖屏切换时，同步结果区的收放状态
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const rp = document.querySelector('.right');
    if(!rp) return;
    rp.classList.toggle('collapsed', window.matchMedia('(max-width:1180px)').matches);
  }, 180);
});

// 首次进入给个热身提示
window.addEventListener('error', e => console.warn('[pyquest]', e.message));
